    <style>
      .site-loader-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
      }

      .site-loader-grid {
        --animation-duration: 2.1s;
        --cube-color: #0000;
        --highlight-color: #00cc44;
        --cube-width: 48px;
        --cube-height: 48px;
        --font-size: 1.8em;
        position: relative;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(7, var(--cube-width));
        grid-template-rows: auto;
        gap: 0;
        width: calc(7 * var(--cube-width));
        height: var(--cube-height);
        perspective: 350px;
        font-family: Poppins, Inter, system-ui, sans-serif;
        font-size: var(--font-size);
        font-weight: 800;
        color: transparent;
      }

      .site-loader-cube {
        position: relative;
        transform-style: preserve-3d;
        animation: site-loader-translate-z var(--animation-duration) ease-in-out infinite;
      }

      .site-loader-face {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--cube-width);
        height: var(--cube-height);
        background-color: var(--cube-color);
      }

      .site-loader-face-left,
      .site-loader-face-right,
      .site-loader-face-back,
      .site-loader-face-front {
        box-shadow: inset 0 0 2px 1px #0001, inset 0 0 12px 1px #fff1;
      }

      .site-loader-face-front {
        transform: rotateY(0deg) translateZ(calc(var(--cube-width) / 2));
      }

      .site-loader-face-back {
        transform: rotateY(180deg) translateZ(calc(var(--cube-width) / 2));
        opacity: 0.6;
      }

      .site-loader-face-left {
        transform: rotateY(-90deg) translateZ(calc(var(--cube-width) / 2));
        opacity: 0.6;
      }

      .site-loader-face-right {
        transform: rotateY(90deg) translateZ(calc(var(--cube-width) / 2));
        opacity: 0.6;
      }

      .site-loader-face-top {
        height: var(--cube-width);
        transform: rotateX(90deg) translateZ(calc(var(--cube-width) / 2));
        opacity: 0.8;
      }

      .site-loader-face-bottom {
        height: var(--cube-width);
        transform: rotateX(-90deg) translateZ(calc(var(--cube-height) - var(--cube-width) * 0.5));
        opacity: 0.8;
      }

      .site-loader-cube:nth-child(1) {
        z-index: 0;
        animation-delay: 0s;
      }

      .site-loader-cube:nth-child(2) {
        z-index: 1;
        animation-delay: 0.2s;
      }

      .site-loader-cube:nth-child(3) {
        z-index: 2;
        animation-delay: 0.4s;
      }

      .site-loader-cube:nth-child(4) {
        z-index: 3;
        animation-delay: 0.6s;
      }

      .site-loader-cube:nth-child(5) {
        z-index: 2;
        animation-delay: 0.8s;
      }

      .site-loader-cube:nth-child(6) {
        z-index: 1;
        animation-delay: 1s;
      }

      .site-loader-cube:nth-child(7) {
        z-index: 0;
        animation-delay: 1.2s;
      }

      .site-loader-cube .site-loader-face {
        animation:
          site-loader-face-color var(--animation-duration) ease-in-out infinite,
          site-loader-edge-glow var(--animation-duration) ease-in-out infinite;
        animation-delay: inherit;
      }

      .site-loader-cube .site-loader-face-front {
        animation:
          site-loader-face-color var(--animation-duration) ease-in-out infinite,
          site-loader-face-glow var(--animation-duration) ease-in-out infinite,
          site-loader-edge-glow var(--animation-duration) ease-in-out infinite;
        animation-delay: inherit;
      }

      @keyframes site-loader-translate-z {
        0%,
        40%,
        100% {
          transform: translateZ(-2px);
        }
        30% {
          transform: translateZ(16px) translateY(-1px);
        }
      }

      @keyframes site-loader-face-color {
        0%,
        50%,
        100% {
          background-color: var(--cube-color);
        }
        10% {
          background-color: var(--highlight-color);
        }
      }

      @keyframes site-loader-face-glow {
        0%,
        50%,
        100% {
          color: #fff0;
          filter: none;
        }
        30% {
          color: #fff;
          filter: drop-shadow(0 14px 10px var(--highlight-color));
        }
      }

      @keyframes site-loader-edge-glow {
        0%,
        40%,
        100% {
          box-shadow: inset 0 0 2px 1px #0001, inset 0 0 12px 1px #fff1;
        }
        30% {
          box-shadow: 0 0 2px 0 var(--highlight-color);
        }
      }

      @media (max-width: 480px) {
        .site-loader-grid {
          --cube-width: 36px;
          --cube-height: 36px;
          --font-size: 1.35em;
        }
      }

    <script>
      (function () {
        const loader = document.getElementById('initial-site-loader');
        const hasSeenInitialLoader = sessionStorage.getItem('day1health-initial-loader-seen') === '1';
        window.__DAY1HEALTH_SHOW_INITIAL_LOADER__ = !hasSeenInitialLoader;
        let shouldShowInitialLoader = true;

        if (!hasSeenInitialLoader) {
          sessionStorage.setItem('day1health-initial-loader-seen', '1');
          if (loader) {
            loader.style.display = 'flex';
          }
        } else {
          window.setTimeout(function () {
            if (!shouldShowInitialLoader || document.readyState === 'complete') {
              return;
            }

            if (loader) {
              loader.style.display = 'flex';
            }
          }, 1000);
        }

        window.addEventListener('load', function () {
          shouldShowInitialLoader = false;

          if (loader) {
            loader.style.display = 'none';
          }
        });
      })();
    </script>
    <script>
      (function () {
        const isLocalDevHost = ['localhost', '127.0.0.1', '[::1]'].includes(window.location.hostname);

        if (!isLocalDevHost || !('serviceWorker' in navigator)) {
          return;
        }

        window.__DAY1HEALTH_DISABLE_SW__ = true;

        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations()
            .then(async (registrations) => {
              if (registrations.length === 0) {
                sessionStorage.removeItem('day1health-sw-dev-reset');
                return;
              }

              await Promise.all(registrations.map((registration) => registration.unregister()));

              if ('caches' in window) {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
              }

              if (!sessionStorage.getItem('day1health-sw-dev-reset')) {
                sessionStorage.setItem('day1health-sw-dev-reset', '1');
                window.location.reload();
                return;
              }

              sessionStorage.removeItem('day1health-sw-dev-reset');
            })
            .catch((err) => {
              console.warn('ServiceWorker cleanup failed in local dev:', err);
            });
        });
      })();
    </script>

    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator && !window.__DAY1HEALTH_DISABLE_SW__) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful');
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }

      // Handle PWA installation prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later
        deferredPrompt = e;
        
        // Show install button (you'll need to implement this in your React app)
        const installButton = document.getElementById('install-button');
        if (installButton) {
          installButton.style.display = 'block';
          
          installButton.addEventListener('click', () => {
            // Show the install prompt
            deferredPrompt.prompt();
            // Wait for the user to respond to the prompt
            deferredPrompt.userChoice.then((choiceResult) => {
              if (choiceResult.outcome === 'accepted') {
                console.log('User accepted the install prompt');
              } else {
                console.log('User dismissed the install prompt');
              }
              deferredPrompt = null;
            });
          });
        }
      });
    </script>
